# Shell Template — OpenSphere subShell (SDK 표준 빈 골격). _skeleton에서 인스턴스화.
# 로컬: image=localhost:5000/shell-template:dev (태그 pull). manifest.sha256는 서명 핀 — 서명 시 자동 갱신(빈 골격은 미서명).
apiVersion: plugins.opensphere.io/v1alpha1
kind: UIPluginPackage
metadata:
  name: shell-template
  namespace: opensphere-system
spec:
  kind: subShell
  hostRef: main
  hostApiVersion: "1.0.0"
  hostCompat: ">=1.0.0 <2.0.0"
  serviceAccountName: opensphere-shell-template
  displayName: "Shell Template"
  owner: platform-experience
  version: 0.1.0
  description: "Shell Template — OpenSphere subShell (SDK 표준 골격)"
  image:
    repository: shell-template
    digest: sha256:9c234f2c2d8c949abceb3d4b868d4eb1d020069ed61e7e11c339c700c2758bd8
  nav:
    band: "구축 Build"
    label: "Shell Template"
  manifest:
    path: /plugins/ui-shell.manifest.json
    sha256: "6905a405328324f5b2c0717b29aa6aec96e758b9fe3e28fe543b2a94cbcfc0ed"
    signaturePath: /plugins/ui-shell.manifest.json.sig
  trust:
    keyId: opensphere-plugins-v1
  shellCompat: ">=0.2.0 <0.9.0"
  permissions:
    - page:register
    - api:proxy
  api:
    basePath: /api/plugins/shell-template
  contributions:
    page: { enabled: true }
    navigation: { enabled: false, mode: "none", reason: "Shell Template owns navigation inside its page" }
    api: { enabled: true, basePath: "/api/plugins/shell-template" }
    cli: { enabled: false, reason: "Shell Template CLI manifest is not published" }
    manual: { enabled: false, mode: "none", reason: "Shell Template Manual contribution is not published" }
    search: { enabled: false, mode: "none", reason: "Shell Template search contribution is not published" }
    notification: { enabled: false, frontend: false, backend: false, reason: "Shell Template notification contribution is not published" }
    observability: { enabled: false, logs: false, metrics: false, traces: false, reason: "Shell Template observability contract is not published" }
---
apiVersion: plugins.opensphere.io/v1alpha1
kind: UIPluginRegistration
metadata:
  name: shell-template
  namespace: opensphere-system
spec:
  packageRef:
    name: shell-template
  desiredState: Enabled
  installPolicy:
    createWorkload: true
    createProxyRoute: false
    exposeInNavigation: true
  approval:
    requestedBy: cmars
    reason: "Shell Template subShell (SDK 표준 골격)"
